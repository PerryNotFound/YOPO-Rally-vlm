[project]
name = "diablo-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.13"
authors = [{ name = "chy", email = "1274653465@qq.com" }]
dependencies = [
  "casadi>=3.6.7",
  "matplotlib>=3.9.2",
  # "numpy>=2.1.3",
  "numpy<2.0",
  "opencv-python>=4.10.0.84",
  "rasterio>=1.4.2",
  "rich>=13.9.4",
  "rtoml>=0.11.0",
  "scipy>=1.14.1",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "tensorboard>=2.18.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "pyinstrument>=5.0.0",
  "pytest-xdist>=3.6.1",
  "pytest>=8.3.3",
  "pandas>=2.2.3",
  "tensorboard-plugin-profile>=2.18.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "platform_system != 'darwin'" }]
torchvision = [
  { index = "pytorch-cu124", marker = "platform_system != 'darwin'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
